name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - perf/pairing-and-chat-latency

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build, Smoke-Test & Package macOS DMG (Universal Mac Catalyst)
        run: |
          mkdir -p ./build
          tr -d '\r' < ./scripts/build-macos-dmg.sh > ./build/build-macos-dmg.lf.sh
          bash ./build/build-macos-dmg.lf.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLens-macOS-dmg
          path: OpenLens-macOS.dmg
          if-no-files-found: error

  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build OpenLens (Release iOS)
        run: |
          xcodebuild \
            -project OpenLens.xcodeproj \
            -scheme OpenLens \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA & Extract Release Metadata
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/OpenLens.app"
          test -d "$APP_PATH"
          rm -rf build/ipa Payload OpenLens.ipa build/release-meta.env
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/OpenLens.app
          (cd build/ipa && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/OpenLens.ipa")
          ls -lh "$GITHUB_WORKSPACE/OpenLens.ipa"

          PLIST="$APP_PATH/Info.plist"
          MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")
          printf "MARKETING_VERSION=%s\nBUILD_NUMBER=%s\n" "$MARKETING_VERSION" "$BUILD_NUMBER" > build/release-meta.env
          cat build/release-meta.env

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLens-ipa
          path: OpenLens.ipa
          if-no-files-found: error

      - name: Upload Release Metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: build/release-meta.env
          if-no-files-found: error

  test-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Run hosted simulator tests
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in sorted(d["devices"].items(), reverse=True) if ".iOS-26" in runtime for x in devices if "iPhone" in x["name"]))')
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"
          ./scripts/test-ios.sh --simulator "$SIMULATOR" --simulator-timeout 300 --test-timeout 1200 --build-timeout 900

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: build/test-runs/**/*.log

      - name: Capture session layouts
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/OpenLens.app' -type d -print -quit)
          test -n "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl install "$SIMULATOR" "$APP_PATH"
          mkdir -p build/screenshots
          for LAYOUT in Focus Recent 'By repo'; do
            xcrun simctl launch --terminate-running-process "$SIMULATOR" "$BUNDLE_ID" SCREENSHOT_MODE SCREENSHOT_SESSION_ORGANIZATION -sessions.layout "$LAYOUT"
            sleep 3
            xcrun simctl io "$SIMULATOR" screenshot "build/screenshots/sessions-$LAYOUT.png"
          done
          xcrun simctl terminate "$SIMULATOR" "$BUNDLE_ID"

          IPAD_SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for runtime, devices in sorted(d["devices"].items(), reverse=True) if ".iOS-26" in runtime for x in devices if "iPad" in x["name"]), ""))')
          if [ -n "$IPAD_SIM" ]; then
            xcrun simctl boot "$IPAD_SIM" || true
            xcrun simctl bootstatus "$IPAD_SIM" -b || true
            xcrun simctl install "$IPAD_SIM" "$APP_PATH"
            xcrun simctl launch --terminate-running-process "$IPAD_SIM" "$BUNDLE_ID" SCREENSHOT_MODE SCREENSHOT_SESSION_ORGANIZATION SCREENSHOT_CHAT_SESSION -sessions.layout Focus
            sleep 4
            xcrun simctl io "$IPAD_SIM" screenshot "build/screenshots/sidebar-desktop-layout.png"
            xcrun simctl shutdown "$IPAD_SIM" || true
          fi

      - name: Upload session screenshots
        uses: actions/upload-artifact@v4
        with:
          name: session-layout-screenshots
          path: build/screenshots/

  publish-release:
    needs:
      - build-macos
      - build-ios
      - test-ios
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenLens-ipa
          path: .

      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenLens-macOS-dmg
          path: .

      - name: Download Release Metadata
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source ./release-meta.env
          test -f OpenLens.ipa
          test -f OpenLens-macOS.dmg
          TAG="v${MARKETING_VERSION}.${BUILD_NUMBER}-perf"
          SUBJECT=$(git log -1 --pretty=%s)
          TITLE="OpenLens v${MARKETING_VERSION} (${BUILD_NUMBER}) — ${SUBJECT}"
          NOTES="Automated release from commit ${GITHUB_SHA} (Actions run ${GITHUB_RUN_ID}). Full hosted iOS simulator test suite, iOS Release IPA, and Universal macOS DMG (Apple Silicon + Intel, launch-smoke-tested) passed. Note: OpenLens.ipa is unsigned (sign before iOS install); on macOS, drag OpenLens.app to Applications (if Gatekeeper prompts on first launch, right-click Open or run: xattr -cr /Applications/OpenLens.app)."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" OpenLens.ipa OpenLens-macOS.dmg --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" OpenLens.ipa OpenLens-macOS.dmg \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
